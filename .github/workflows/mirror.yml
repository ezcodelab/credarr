# SPDX-License-Identifier: MIT
name: Mirror from Gitea

# Gitea is canonical. GitHub is a read-only public mirror of main and tags.
# This job never deletes GitHub refs and never mirrors internal branches.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-from-gitea
  cancel-in-progress: true

jobs:
  mirror:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Gitea main and tags
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          git remote add gitea "https://git.ezcloud.casa/admin/${repo}.git"
          git fetch --no-tags gitea main
          git fetch gitea 'refs/tags/*:refs/tags/*'

      - name: Push main fast-forward only
        run: git push origin refs/remotes/gitea/main:refs/heads/main

      - name: Push tags without deleting
        run: git push origin --tags
