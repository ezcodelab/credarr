# CI for the public GitHub repository.
#
# This is the GitHub-native twin of .gitea/workflows/ci.yaml. The Gitea copy
# cannot use actions/setup-python (its runner only reads a local tool cache), so
# it builds a venv from the image's python. Here the standard setup actions
# work, and the runner has Docker and a browser.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Engine and server tests
        run: .venv/bin/python -m pytest -o addopts="" -m "not integration" -q -n auto

      - name: Console unit tests
        run: |
          set -euo pipefail
          cd ui
          npm ci --no-audit --no-fund
          npm test

  container:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the image and boot it
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e ".[dev]"
          make image
          .venv/bin/python -m pytest -m integration -o addopts="--strict-markers" -q

  smoke:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e ".[dev]"

      - name: Install the browser
        run: |
          set -euo pipefail
          cd ui
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Console end to end
        run: make ui-smoke
